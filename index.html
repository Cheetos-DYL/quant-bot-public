<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantBot Leaderboard — Alpaca Paper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.5 system-ui,sans-serif;background:#0f1115;color:#e5e7eb;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:26px;margin-bottom:4px}.sub{font-size:13px;color:#8b949e;margin-bottom:24px}
table{width:100%;border-collapse:collapse;background:#161a22;border:1px solid #232a36;border-radius:10px;overflow:hidden;margin-bottom:24px}
th{text-align:left;padding:12px 16px;font-size:11px;text-transform:uppercase;color:#8b949e;background:#1b2029;border-bottom:1px solid #232a36}
td{padding:12px 16px;border-bottom:1px solid #1e2530;font-size:15px}
tr:last-child td{border-bottom:none}
.rank{font-weight:700;color:#8b949e;width:60px}
.bot{font-weight:600}.green{color:#3fb950}.red{color:#f85149}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.badge-on{background:#12291d;color:#3fb950}.badge-off{background:#2d1518;color:#f85149}
h2{font-size:18px;margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid #232a36}
.chart{background:#161a22;border:1px solid #232a36;border-radius:10px;padding:16px;margin-bottom:24px}
.chart svg{width:100%;height:200px}
.hist{font-size:13px;color:#8b949e;margin-bottom:8px}
.empty{color:#6b7280;padding:16px;text-align:center}
.footer{margin-top:40px;padding-top:16px;border-top:1px solid #232a36;font-size:12px;color:#6b7280;text-align:center}
</style>
</head>
<body>

<h1>QuantBot Leaderboard</h1>
<div class="sub">Alpaca paper accounts · $1,000,000 starting capital · read-only snapshot</div>

<table id="leaderboard">
  <thead><tr><th>Rank</th><th>Bot</th><th>Portfolio</th><th>P&amp;L</th><th>Status</th></tr></thead>
  <tbody></tbody>
</table>

<div id="bots"></div>

<div class="footer" id="footer"></div>

<script>
const fmt = n => Number(n).toLocaleString("en", {minimumFractionDigits:2, maximumFractionDigits:2});

fetch("data.json")
  .then(r => r.json())
  .then(d => {
    const bots = d.leaderboard || [];

    document.querySelector("#leaderboard tbody").innerHTML = bots.length
      ? bots.map((b, i) => {
          const pnl = b.pnl || 0;
          const cls = b.status === "ONLINE" ? "badge-on" : "badge-off";
          return `<tr><td class="rank">#${i+1}</td><td class="bot">${b.name}</td>` +
                 `<td>$${fmt(b.value)}</td>` +
                 `<td class="${pnl >= 0 ? "green" : "red"}">${pnl >= 0 ? "+" : ""}$${fmt(pnl)}</td>` +
                 `<td><span class="badge ${cls}">${b.status}</span></td></tr>`;
        }).join("")
      : '<tr><td colspan="5" class="empty">No data yet</td></tr>';

    document.getElementById("bots").innerHTML = bots.map(b => {
      const eq = b.equity || [];
      let chart = '<div class="empty">No equity history yet</div>';
      if (eq.length >= 2) {
        const vals = eq.map(p => Number(p.v));
        const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
        const pts = vals.map((v, i) =>
          `${(i * 100 / (vals.length - 1)).toFixed(1)},${(105 - (v - lo) * 95 / span).toFixed(1)}`
        ).join(" ");
        const color = vals[vals.length-1] >= vals[0] ? "#3fb950" : "#f85149";
        chart = `<div class="chart"><svg viewBox="0 0 100 110" preserveAspectRatio="none">` +
                `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg></div>`;
      }

      const orders = b.orders || [];
      const hist = orders.length
        ? `<table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead><tbody>` +
          orders.slice(0, 20).map(o => {
            const t = (o.submitted_at || "").replace("T", " ").slice(0, 19);
            const side = o.side === "buy" ? `<span class="green">BUY</span>` : `<span class="red">SELL</span>`;
            return `<tr><td>${t}</td><td>${o.symbol}</td><td>${side}</td><td>${o.filled_qty || o.qty || "0"}</td>` +
                   `<td>${o.filled_avg_price ? "$" + Number(o.filled_avg_price).toFixed(2) : "—"}</td><td>${o.status}</td></tr>`;
          }).join("") + `</tbody></table>`
        : '<div class="empty">No orders yet</div>';

      return `<h2>${b.name}</h2>` +
             `<div class="hist">Portfolio <b>$${fmt(b.value)}</b> · P&amp;L <b class="${b.pnl >= 0 ? "green" : "red"}">${b.pnl >= 0 ? "+" : ""}$${fmt(b.pnl)}</b></div>` +
             chart + hist;
    }).join("");

    document.getElementById("footer").textContent = `QuantBot Leaderboard · Alpaca paper · Snapshot: ${d.updated} · Auto-refreshes on push`;
  })
  .catch(() => document.body.innerHTML += '<p style="color:#f85149">Failed to load data. Check back later.</p>');
</script>
</body>
</html>
